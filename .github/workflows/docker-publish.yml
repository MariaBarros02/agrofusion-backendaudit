name: Construir, Escanear y Subir Imagen

on:
  push:
    branches:
      - main

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NUEVO: Preparamos el motor de Docker
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PASO 1: Construimos la imagen pero la dejamos en revisión (load: true)
      - name: 1. Construir imagen localmente (Para escanear)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true 
          tags: local-image:test

      # PASO 2: Trivy busca errores Altos y nos da una advertencia visual
      - name: 2. Escaneo Trivy (Nivel HIGH - Advertencia)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-image:test'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH'

      # PASO 3: Trivy escribe todo lo que encontró en un archivo llamado trivy-report.json
      - name: 3. Escaneo Trivy (Generar Reporte)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-image:test'
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'

      # PASO 4: El robot toma el archivo JSON y te lo deja descargable en la página de GitHub
      - name: 4. Subir reporte como artefacto a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: reporte-seguridad-trivy
          path: trivy-report.json

      # PASO 5: Trivy busca errores FATALES. Si encuentra uno, destruye el proceso (exit-code: 1)
      - name: 5. Escaneo Trivy (Nivel CRITICAL - Bloquea si hay error)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-image:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      # PASO 6: Si Trivy no encontro nada, se sube la imagen a la nube oficialmente
      - name: 6. Subir imagen a GHCR (Solo si pasó la seguridad)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
